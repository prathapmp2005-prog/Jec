name: Build JEC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Android project
        run: |
          echo "Checking JEC Android project..."

          test -f settings.gradle.kts || {
            echo "ERROR: settings.gradle.kts missing"
            exit 1
          }

          test -f app/build.gradle.kts || {
            echo "ERROR: app/build.gradle.kts missing"
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml missing"
            exit 1
          }

          echo "Android project structure OK"

      - name: Verify Firebase
        run: |
          test -f app/google-services.json || {
            echo "ERROR: app/google-services.json missing"
            exit 1
          }

          grep -q "in.jec.jagenelectriciancompany" app/google-services.json || {
            echo "ERROR: Firebase package name mismatch"
            exit 1
          }

          echo "Firebase configuration OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Clean project
        run: ./gradlew clean

      - name: Build JEC Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK generated
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "JEC APK GENERATED SUCCESSFULLY"
          ls -lh "$APK"

          unzip -t "$APK"

      - name: Upload JEC APK
        uses: actions/upload-artifact@v4
        with:
          name: JEC-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
